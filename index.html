<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>3D ボールころころ2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="player">
  <div class="bar">
    <button id="flag" type="button" aria-label="最初から始める" title="最初から始める">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 3v18M5 4h13l-3 4.5 3 4.5H5" fill="#2fb34a" stroke="#1d8a35" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
    <button id="stop" type="button" aria-label="停止" title="停止">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z" fill="#e5473d" stroke="#b5332b" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <button id="times" type="button" aria-label="今までのタイムを表示" title="今までのタイムを表示">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="#ff7a00" stroke="#a84300" stroke-width="2"/><path d="M12 8v5l3 2M9.5 2.5h5" fill="none" stroke="#5c2200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="hint">マウス / タッチで左右に操作。スペースキーで始めると ← → キー操作</span>
  </div>
  <div class="stage-wrap">
    <canvas id="stage" aria-label="ゲーム画面"></canvas>
    <aside id="history" class="hidden" aria-label="タイム一覧">
      <h2><span>今までのタイム</span><button id="history-close" type="button" aria-label="閉じる">×</button></h2>
      <ol id="history-list"></ol>
      <div class="foot"><span id="history-best"></span><button id="history-clear" type="button">消去</button></div>
    </aside>
    <button id="overlay" type="button">
      <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true"><path d="M5 3v18M5 4h13l-3 4.5 3 4.5H5" fill="#2fb34a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>クリックして開始</span>
    </button>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
